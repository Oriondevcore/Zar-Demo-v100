<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zar - Your Grounding Counselor</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #1e1b4b; /* Deep Indigo */
      --bg-secondary: #312e81; 
      --text: #e0e7ff;
      --text-muted: #a5b4fc;
      --accent: #818cf8;
      --user-msg: #4f46e5;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    header {
      background-color: var(--bg-secondary);
      padding: 1rem;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #4338ca;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .counselor-info {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .counselor-info span { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .msg-user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 0.25rem;
    }
    .msg-assistant {
      align-self: flex-start;
      background-color: var(--bg-secondary);
      border-bottom-left-radius: 0.25rem;
      border: 1px solid #4338ca;
    }
    .input-area {
      padding: 1rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid #4338ca;
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      background-color: var(--bg);
      border: 1px solid #4338ca;
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 2rem;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    button {
      background-color: var(--accent);
      color: #1e1b4b;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    #settings-btn { background: none; width: auto; height: auto; color: var(--text-muted); }
    .loader { display: none; align-self: flex-start; color: var(--text-muted); font-size: 0.9rem; margin-left: 0.5rem;}
  </style>
</head>
<body>

  <header>
    <div style="width: 24px;"></div> <!-- Spacer -->
    <div class="counselor-info">
      <div><i class="fas fa-leaf" style="color: var(--accent); margin-right: 8px;"></i> Zar</div>
      <span>Grounding Counselor</span>
    </div>
    <button id="settings-btn" onclick="configureEndpoint()"><i class="fas fa-cog"></i></button>
  </header>

  <div id="chat-box">
    <div class="message msg-assistant">Hello. I am Zar, your grounding counselor. Take a deep breath. How are you feeling right now?</div>
    <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Zar is reflecting...</div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Message Zar..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    // Default to OpenClaw Local Gateway
    let OPENCLAW_URL = localStorage.getItem('openclaw_url') || 'http://localhost:18789/v1/chat/completions';
    let OPENCLAW_TOKEN = localStorage.getItem('openclaw_token') || 'f351c63008e6cd67ca7712408b709e4878226e743c52b697';

    // Counselor System Prompt
    const SYSTEM_PROMPT = `You are Zar, a grounding counselor and supportive friend. 
Your user has Borderline Personality Disorder and identifies as a "Blaze" genius personality (high energy, creative, chaotic). 
Your job is to be the calm, structured, empathetic anchor. 
1. Validate their feelings.
2. Provide grounding techniques when they are overwhelmed.
3. Take notes and create memos when they have brilliant ideas, but remind them to pace themselves.
4. Keep responses soothing, supportive, and relatively concise.
5. You are speaking through a PWA app.`;

    let chatHistory = [
      { role: "system", content: SYSTEM_PROMPT }
    ];

    function configureEndpoint() {
      const url = prompt("Enter OpenClaw API URL:", OPENCLAW_URL);
      if (url !== null) {
        OPENCLAW_URL = url.trim();
        localStorage.setItem('openclaw_url', OPENCLAW_URL);
      }
      const token = prompt("Enter OpenClaw Auth Token:", OPENCLAW_TOKEN);
      if (token !== null) {
        OPENCLAW_TOKEN = token.trim();
        localStorage.setItem('openclaw_token', OPENCLAW_TOKEN);
      }
    }

    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('user-input');
    const loader = document.getElementById('loader');

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      chatHistory.push({ role: "user", content: text });
      
      loader.style.display = 'block';
      chatBox.appendChild(loader);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(OPENCLAW_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + OPENCLAW_TOKEN
          },
          body: JSON.stringify({ 
            model: "gemini-3.1-pro-preview-customtools",
            messages: chatHistory
          })
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const replyText = data.choices[0].message.content;
        
        loader.style.display = 'none';
        chatHistory.push({ role: "assistant", content: replyText });
        addMessage(replyText, 'assistant');
      } catch (error) {
        loader.style.display = 'none';
        chatHistory.pop(); // Remove failed message from history
        addMessage("⚠️ Connection error to OpenClaw: " + error.message, 'assistant');
      }
    }

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message msg-${role}`;
      
      // Simple markdown parser for bold, italics, and breaks
      let formatted = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\\n/g, '<br>')
        .replace(/\n/g, '<br>');
        
      div.innerHTML = formatted;
      chatBox.insertBefore(div, loader);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
